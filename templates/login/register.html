<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIDEGEDUC</title> <!--Este es el titulo de la pagina-->
    <link rel="stylesheet" href="{{ url_for('static', filename='login/style.css') }}" />
    <style>
        /* Fallback minimal styles if external CSS fails to load */
        body{background:#ffffff;color:#000;font-family:Arial,Helvetica,sans-serif}
        .auth-container{padding:2rem}
        .right-panel, .left-panel{display:block}
    </style>
    <title>Formulario</title>
</head>

<body>
    <div class="auth-container">
        <div class="left-panel" style="background-image: url('{{ url_for('static', filename='login/bg-image.jpg') }}');">
            
        </div>

        <div class="right-panel">
            <div class="form-wrap">
                <!-- panel header removed to simplify UI -->

                <h1>Registrarse</h1>

                <form action="{{ url_for('login.register_handler') }}" method="POST" class="register-form">
                    <label for="usuario">Nombre de Usuario</label>
                    <input type="text" name="usuario" id="usuario" required>

                    <label for="clave">Clave</label>
                    <input type="password" name="clave" id="clave" required>

                    <div class="checkbox-row">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">Acepto los términos de servicio</label>
                    </div>

                    <button type="submit" class="btn-submit">Sign Up</button>
                </form>

                <p class="alt-link">¿Ya tienes cuenta? <a href="{{ url_for('login.login_handler') }}">Inicia sesión</a></p>
            </div>
        </div>
    </div>

        <!-- Modal overlay -->
        <div id="status-modal" class="modal-overlay" aria-hidden="true">
            <div class="modal">
                <h2 id="modal-title">Mensaje</h2>
                <p id="modal-message"></p>
                <button id="modal-close">Cerrar</button>
            </div>
        </div>

        <script>
            function showModal(title, message) {
                const overlay = document.getElementById('status-modal');
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-message').innerText = message;
                overlay.setAttribute('aria-hidden', 'false');
                overlay.classList.add('visible');
            }

            document.addEventListener('DOMContentLoaded', function() {
                const btn = document.getElementById('modal-close');
                if (btn) btn.addEventListener('click', function() {
                    const overlay = document.getElementById('status-modal');
                    overlay.setAttribute('aria-hidden', 'true');
                    overlay.classList.remove('visible');
                });

                {% if modal_show %}
                    showModal({{ modal_title | tojson }}, {{ modal_message | tojson }});
                {% endif %}
            });
        </script>
</body>
</html>
