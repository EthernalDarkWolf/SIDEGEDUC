<div class="card">
    <h3>Gestionar Roles y Estado de Usuario</h3>
    {% if message %}
        <p class="muted" style="color:green">{{ message }}</p>
    {% endif %}
    <form method="post">
        <label>Usuario:
            <select name="user_id" required>
                <option value="">-- seleccionar --</option>
                {% for u in users %}
                    <option value="{{ u.id_user }}">{{ u.nombre }}</option>
                {% endfor %}
            </select>
        </label>
        <div style="height:8px"></div>
        <label>Rol:
            <select name="role_id">
                <option value="">-- mantener --</option>
                {% for r in roles %}
                    <option value="{{ r.id_rol }}">{{ r.nombre_rol }}</option>
                {% endfor %}
            </select>
        </label>
        <div style="height:8px"></div>
        <label>Estado:
            <select name="status_id">
                <option value="">-- mantener --</option>
                {% for s in statuses %}
                    <option value="{{ s.id_status_user }}">{{ s.estado }}</option>
                {% endfor %}
            </select>
        </label>
        <div style="margin-top:12px">
            <button class="panel-btn secondary" type="submit">Actualizar usuario</button>
        </div>
    </form>
</div>
