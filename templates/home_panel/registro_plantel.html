<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Registro de Plantel</h3>
                </div>
                <div class="card-body">
                    {% if message %}
                        <div class="alert alert-success">{{ message }}</div>
                    {% endif %}
                    <form method="post" id="plantelForm">
                        {% if edit and plantel %}
                            <input type="hidden" name="id_plantel" value="{{ plantel.id_plantel }}">
                        {% endif %}
                        <div class="mb-3">
                            <label for="nombre_plantel" class="form-label">Nombre del plantel:</label>
                            <input type="text" id="nombre_plantel" name="nombre_plantel_nomina" class="form-control" required data-rule="letters" data-minlength="1" data-maxlength="100" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+" title="Solo letras y espacios" value="{{ plantel.nombre_plantel_nomina if plantel }}">
                        </div>
                        <div class="mb-3">
                            <label for="codigo_pa" class="form-label">Código PA:</label>
                            <input type="text" id="codigo_pa" name="codigo_pa" class="form-control" required data-rule="numbers" data-minlength="1" data-maxlength="20" pattern="\d+" inputmode="numeric" title="Solo números" value="{{ plantel.codigo_pa if plantel }}">
                        </div>
                        <button type="submit" class="btn btn-primary">{% if edit %}Guardar cambios{% else %}Registrar Plantel{% endif %}</button>
                    </form>
                    <script src="{{ url_for('static', filename='home_panel/form_validators.js') }}"></script>
                </div>
            </div>
        </div>
    </div>
</div>
