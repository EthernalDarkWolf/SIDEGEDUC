<div class="container mt-4">
    <div style="margin-bottom:12px">
        <a href="{{ url_for('consultas_secciones') }}" class="btn btn-sm btn-outline-secondary">← Volver</a>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Secciones Existentes</h3>
                </div>
                <div class="card-body">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Grado</th>
                                <th>Letra</th>
                                <th>Nivel</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for s in secciones %}
                                <tr>
                                    <td>{{ s.id_seccion }}</td>
                                    <td>{{ s.numero_grado or 'N/A' }}</td>
                                    <td>{{ s.letra or 'N/A' }}</td>
                                    <td>{{ s.nombre_nivel or 'N/A' }}</td>
                                </tr>
                            {% else %}
                                <tr>
                                    <td colspan="4" class="text-center">No hay secciones existentes</td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
