<div class="registro-persona">
    <h3>Registro de Persona</h3>
    {% if message %}
        <p class="success">{{ message }}</p>
    {% endif %}

    <form method="post" id="personaForm">
        <div class="grid">
            <div class="group">
                <label>Primer nombre</label>
                <input name="primer_nombre" required placeholder="Ingrese primer nombre">
            </div>
            <div class="group">
                <label>Segundo nombre</label>
                <input name="segundo_nombre" placeholder="(opcional)">
            </div>
            <div class="group">
                <label>Primer apellido</label>
                <input name="primer_apellido" required placeholder="Ingrese primer apellido">
            </div>
            <div class="group">
                <label>Segundo apellido</label>
                <input name="segundo_apellido" placeholder="(opcional)">
            </div>

            <div class="group date-grid">
                <label>Fecha de nacimiento</label>
                <div class="date-selects">
                    <select id="birth_day" aria-label="Día"></select>
                    <select id="birth_month" aria-label="Mes"></select>
                    <select id="birth_year" aria-label="Año"></select>
                </div>
                <input type="hidden" name="fecha_nacimiento" id="fecha_nacimiento">
            </div>

            <div class="group">
                <label>Sexo</label>
                <select name="id_sexo">
                    <option value="">-- sin especificar --</option>
                    {% for s in sexos %}
                        <option value="{{ s.id_sexo }}">{{ s.letra_sexo }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="group">
                <label>Tipo de documento (opcional)</label>
                <select name="id_tipo_documento">
                    <option value="">-- ninguno --</option>
                    {% for td in tipo_documentos %}
                        <option value="{{ td.id_tipo_documento }}">{{ td.nombre_tipo_documento }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="group">
                <label>Número de cédula (opcional)</label>
                <input name="numero_cedula" placeholder="Ej: 12345678">
            </div>

            <div class="group">
                <label>Tipo de persona</label>
                <select name="tipo_persona" id="tipo_persona" required>
                    <option value="estudiante">Estudiante</option>
                    <option value="representante">Representante</option>
                    <option value="profesor">Profesor</option>
                    <option value="empleado">Empleado</option>
                </select>
            </div>

            <div id="fields_estudiante" class="group extra-group" style="display:block">
                <label>Fecha inscripción (estudiante)</label>
                <input type="date" name="fecha_inscripcion">
            </div>

            <div id="fields_representante" class="group extra-group" style="display:none">
                <label>Número de hijos (representante)</label>
                <input type="number" name="numero_hijos" min="0" value="0">
            </div>
        </div>

        <div style="margin-top:12px">
            <button type="submit" class="panel-btn">Registrar persona</button>
        </div>
    </form>

    <style>
        .registro-persona h3{margin-top:0}
        .registro-persona .success{color:var(--accent2);font-weight:700}
        .registro-persona .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
        .registro-persona .group{display:flex;flex-direction:column}
        .registro-persona label{font-weight:600;margin-bottom:6px;color:var(--muted)}
        .registro-persona input,.registro-persona select{padding:10px;border-radius:8px;border:1px solid rgba(11,18,32,0.08)}
        .registro-persona .date-selects{display:flex;gap:8px}
        .registro-persona .date-selects select{flex:1}
        .registro-persona .extra-group input{width:100%}
        @media(max-width:600px){.registro-persona .date-selects{flex-direction:column}}
    </style>

    <script>
        // Poblar selects para día/mes/año
        (function(){
            const day = document.getElementById('birth_day');
            const month = document.getElementById('birth_month');
            const year = document.getElementById('birth_year');
            const hidden = document.getElementById('fecha_nacimiento');

            for(let d=1; d<=31; d++){ const opt = document.createElement('option'); opt.value = String(d).padStart(2,'0'); opt.text = d; day.appendChild(opt); }
            const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
            for(let m=1;m<=12;m++){ const opt = document.createElement('option'); opt.value = String(m).padStart(2,'0'); opt.text = months[m-1]; month.appendChild(opt); }
            const now = new Date(); const curY = now.getFullYear();
            for(let y=curY; y>=curY-100; y--){ const opt = document.createElement('option'); opt.value = y; opt.text = y; year.appendChild(opt); }

            function syncHidden(){
                const d = day.value; const m = month.value; const y = year.value;
                if(d && m && y){ hidden.value = `${y}-${m}-${d}`; }
                else hidden.value = '';
            }

            day.addEventListener('change', syncHidden);
            month.addEventListener('change', syncHidden);
            year.addEventListener('change', syncHidden);
            try{ if(!year.value) { year.value = String(curY-20); } if(!month.value) month.value='01'; if(!day.value) day.value='01'; syncHidden(); } catch(e){}
        })();

        // Toggle campos extra según tipo de persona
        (function(){
            const tipo = document.getElementById('tipo_persona');
            const fe = document.getElementById('fields_estudiante');
            const fr = document.getElementById('fields_representante');
            function toggle(){
                if(tipo.value === 'estudiante'){
                    fe.style.display = 'block'; fr.style.display = 'none';
                } else if(tipo.value === 'representante'){
                    fe.style.display = 'none'; fr.style.display = 'block';
                } else { fe.style.display = 'none'; fr.style.display = 'none'; }
            }
            tipo.addEventListener('change', toggle);
            toggle();
        })();

        // Antes de enviar: asegurar que fecha_nacimiento esté seteada
        document.getElementById('personaForm').addEventListener('submit', function(e){
            const hidden = document.getElementById('fecha_nacimiento');
            if(!hidden.value){ alert('Por favor seleccione la fecha de nacimiento completa (día/mes/año).'); e.preventDefault(); }
        });
    </script>
</div>
