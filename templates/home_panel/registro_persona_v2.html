<div class="registro-persona">
    <h3>Registro de Persona</h3>
    {% if message %}
        <p class="success">{{ message }}</p>
    {% endif %}

    <form method="post" id="personaForm">
        <div class="card" style="border-radius:12px;padding:18px;border:1px solid var(--card-border);background:var(--panel-bg)">
            <div class="card-body">
                <div class="grid">
            <div class="group">
                <label>Primer nombre</label>
                <input name="primer_nombre" required placeholder="Ingrese primer nombre">
            </div>
            <div class="group">
                <label>Segundo nombre</label>
                <input name="segundo_nombre" placeholder="(opcional)">
            </div>
            <div class="group">
                <label>Primer apellido</label>
                <input name="primer_apellido" required placeholder="Ingrese primer apellido">
            </div>
            <div class="group">
                <label>Segundo apellido</label>
                <input name="segundo_apellido" placeholder="(opcional)">
            </div>

            <div class="group">
                <label for="fecha_nacimiento">Fecha de nacimiento</label>
                <input type="text" id="fecha_nacimiento" name="fecha_nacimiento" placeholder="DD/MM/AAAA" data-flatpickr="true" readonly>
                <small class="muted">Formato visible: DD/MM/AAAA</small>
            </div>

            <div class="group">
                <label>Sexo</label>
                <select name="id_sexo">
                    <option value="">-- sin especificar --</option>
                    {% for s in sexos %}
                        <option value="{{ s.id_sexo }}">{{ s.letra_sexo }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="group">
                <label>Tipo de documento (opcional)</label>
                <select name="id_tipo_documento">
                    <option value="">-- ninguno --</option>
                    {% for td in tipo_documentos %}
                        <option value="{{ td.id_tipo_documento }}">{{ td.nombre_tipo_documento }}</option>
                    {% endfor %}
                    <option value="escolar">Cédula escolar</option>
                </select>
            </div>

            <div class="group">
                <label>Número de cédula (opcional)</label>
                <input name="numero_cedula" placeholder="Ej: 12345678">
            </div>

            <div class="group">
                <label>Tipo de persona</label>
                <select name="tipo_persona" id="tipo_persona" required>
                    <option value="estudiante">Estudiante</option>
                    <option value="representante">Representante</option>
                    <option value="profesor">Profesor</option>
                    <option value="empleado">Empleado</option>
                </select>
            </div>

            <div id="fields_estudiante" class="group extra-group" style="display:block">
                <label for="fecha_inscripcion">Fecha inscripción (estudiante)</label>
                <input type="text" id="fecha_inscripcion" name="fecha_inscripcion" placeholder="DD/MM/AAAA" data-flatpickr="true" readonly>
                <small class="muted">Opcional, conserva el mismo formato</small>
            </div>

            <div id="fields_representante" class="group extra-group" style="display:none">
                <label>Número de hijos (representante)</label>
                <input type="number" name="numero_hijos" min="0" value="0">
            </div>
        </div>

                </div>

                <div style="margin-top:18px">
                    <button type="submit" class="panel-btn primary">Registrar persona</button>
                </div>
            </div>
        </div>
    </form>

    <style>
        .registro-persona h3{margin-top:0;font-size:1.6rem;color:var(--accent-2);display:flex;align-items:center;gap:10px}
        .registro-persona .success{color:var(--accent2);font-weight:700}
        .registro-persona .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
        .registro-persona .group{display:flex;flex-direction:column}
        .registro-persona label{font-weight:600;margin-bottom:8px;color:var(--muted);font-size:0.95rem}
        .registro-persona input,.registro-persona select{padding:12px;border-radius:10px;border:1px solid #e6eef2;background:linear-gradient(180deg,#fff,#fbffff);font-size:0.98rem}
        .registro-persona input[readonly]{background:#fff}
        .registro-persona .muted{color:var(--muted);font-size:0.85rem;margin-top:6px}
        .registro-persona .extra-group input{width:100%}
        .registro-persona .card{background:transparent;border-radius:10px}
        .registro-persona .card-body{padding:8px}
        .registro-persona .disabled-field{background:#efefef !important;color:#666 !important;border-color:#ddd !important}
        .registro-persona .found-notice{background:#fffbe6;border:1px solid #ffd54d;padding:10px;border-radius:8px;margin-bottom:12px;color:#6b4f00}
        .registro-persona .small-actions{display:flex;gap:8px;align-items:center;margin-top:8px}
        .registro-persona .panel-btn.ghost{background:transparent;border:1px solid #cfd8dc;color:var(--muted)}
        @media(max-width:600px){.registro-persona .grid{grid-template-columns:1fr}}
    </style>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>
    <script>
        (function(){
            // initialize flatpickr on elements with data-flatpickr attribute
            const cfg = {
                altInput: true,
                altFormat: 'd/m/Y',
                dateFormat: 'Y-m-d',
                locale: flatpickr.l10ns && flatpickr.l10ns.es ? flatpickr.l10ns.es : undefined,
                allowInput: true,
                clickOpens: true,
                wrap: false,
                // enhance mobile behavior
                disableMobile: true
            };

            document.querySelectorAll('input[data-flatpickr]').forEach(function(el){
                try{
                    // ensure wrapper with icon and helper exists
                    if(!el.closest('.date-field')){
                        const wrapper = document.createElement('div'); wrapper.className='date-field';
                        el.parentNode.insertBefore(wrapper, el); wrapper.appendChild(el);
                        const icon = document.createElement('span'); icon.className='date-icon';
                        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M17 3v2M7 3v2M3 7h18M21 21H3V7h18v14z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
                        wrapper.appendChild(icon);
                        const clearBtn = document.createElement('button'); clearBtn.type='button'; clearBtn.className='date-clear'; clearBtn.title='Limpiar fecha'; clearBtn.innerHTML='✕';
                        clearBtn.style.position='absolute'; clearBtn.style.right='46px'; clearBtn.style.top='50%'; clearBtn.style.transform='translateY(-50%)'; clearBtn.style.border='none'; clearBtn.style.background='transparent'; clearBtn.style.cursor='pointer'; clearBtn.style.fontSize='14px';
                        wrapper.appendChild(clearBtn);
                        const help = document.createElement('span'); help.className='date-helper'; help.textContent = el.getAttribute('placeholder') || 'DD/MM/AAAA'; wrapper.appendChild(help);
                        // icon opens calendar
                        icon.addEventListener('click', function(){ el.focus(); el.click(); });
                        clearBtn.addEventListener('click', function(){ if(el._flatpickr) el._flatpickr.clear(); });
                    }
                    // initialize flatpickr and keep instance on element
                    const instance = flatpickr(el, cfg);
                    el._flatpickr = instance;
                } catch(e){ console.warn('flatpickr init failed', e); }
            });

            // Toggle campos extra según tipo de persona
            const tipo = document.getElementById('tipo_persona');
            const fe = document.getElementById('fields_estudiante');
            const fr = document.getElementById('fields_representante');
            function toggle(){
                if(tipo.value === 'estudiante'){ fe.style.display = 'block'; fr.style.display = 'none'; }
                else if(tipo.value === 'representante'){ fe.style.display = 'none'; fr.style.display = 'block'; }
                else { fe.style.display = 'none'; fr.style.display = 'none'; }
            }
            tipo.addEventListener('change', toggle);
            toggle();

            // Validate before submit
            document.getElementById('personaForm').addEventListener('submit', function(e){
                const hidden = document.getElementById('fecha_nacimiento');
                if(!hidden.value){ alert('Por favor seleccione la fecha de nacimiento.'); e.preventDefault(); }
            });

            // Elemento para mostrar aviso cuando se encuentra persona existente
            const foundNotice = document.createElement('div'); foundNotice.id='foundNotice'; foundNotice.className='found-notice'; foundNotice.style.display='none';
            const form = document.getElementById('personaForm');
            form.parentNode.insertBefore(foundNotice, form);

            // Helper para desactivar/activar campos y aplicar estilos (incluye cédula)
            function setFormDisabled(disabled){
                form.querySelectorAll('input, select, textarea, button').forEach(function(el){
                    if(el.classList && el.classList.contains('date-clear')) return;
                    if(el === foundNotice) return;
                    if(el.type === 'button' && el.classList && el.classList.contains('ghost-action')) return;
                    if(el.tagName === 'BUTTON' && el.type === 'submit'){
                        el.disabled = disabled;
                        if(disabled){ el.dataset.origText = el.textContent; el.textContent = 'Persona ya registrada'; }
                        else { if(el.dataset.origText) el.textContent = el.dataset.origText; }
                        return;
                    }
                    el.disabled = disabled;
                    if(disabled){ el.classList && el.classList.add('disabled-field'); }
                    else { el.classList && el.classList.remove('disabled-field'); }
                });
            }

            // No permitir reactivar ni navegar a ficha desde aquí: solo mostrar aviso
            const actionsWrap = document.createElement('div'); actionsWrap.className='small-actions';

            // Check cedula on blur/change
            const ced = form.querySelector('input[name="numero_cedula"]');
            if(ced){
                let timeout = null;
                function runCheck(){
                    const v = ced.value && ced.value.trim();
                    if(!v){ foundNotice.style.display='none'; setFormDisabled(false); return; }
                    fetch(`/api/persona/lookup?numero=${encodeURIComponent(v)}`)
                        .then(r => r.json())
                        .then(function(j){
                            if(j && j.found){
                                // rellenar campos
                                form.querySelector('input[name="primer_nombre"]').value = j.primer_nombre || '';
                                form.querySelector('input[name="segundo_nombre"]').value = j.segundo_nombre || '';
                                form.querySelector('input[name="primer_apellido"]').value = j.primer_apellido || '';
                                form.querySelector('input[name="segundo_apellido"]').value = j.segundo_apellido || '';
                                const fechaN = document.getElementById('fecha_nacimiento');
                                if(fechaN){ if(j.fecha_nacimiento){ try{ if(fechaN._flatpickr) fechaN._flatpickr.setDate(j.fecha_nacimiento); else fechaN.value = j.fecha_nacimiento; }catch(e){ fechaN.value = j.fecha_nacimiento; } } }
                                // selects
                                const sexSel = form.querySelector('select[name="id_sexo"]'); if(sexSel) sexSel.value = j.id_sexo || '';
                                const tdSel = form.querySelector('select[name="id_tipo_documento"]'); if(tdSel) tdSel.value = j.id_tipo_documento || '';
                                const tipoSel = document.getElementById('tipo_persona'); if(tipoSel) tipoSel.value = j.tipo_persona || tipoSel.value;
                                const fins = document.getElementById('fecha_inscripcion'); if(fins){ if(j.fecha_inscripcion){ try{ if(fins._flatpickr) fins._flatpickr.setDate(j.fecha_inscripcion); else fins.value = j.fecha_inscripcion; }catch(e){ fins.value = j.fecha_inscripcion; } } }

                                foundNotice.innerHTML = `<strong>Datos autocompletados:</strong> ${j.primer_nombre} ${j.primer_apellido} — Cédula: ${j.numero_cedula}<div style="margin-top:8px;color:#a94442;font-weight:700">No puedes volver a registrar esta persona.</div>`;
                                foundNotice.style.display = 'block';
                                if(!foundNotice.querySelector('.small-actions')) foundNotice.appendChild(actionsWrap);
                                // mostrar campos según tipo y desactivar todo el formulario
                                if(document.getElementById('tipo_persona')){ document.getElementById('tipo_persona').value = j.tipo_persona || document.getElementById('tipo_persona').value; }
                                // trigger toggle to show correct extra fields
                                try{ const ev = new Event('change'); document.getElementById('tipo_persona').dispatchEvent(ev); }catch(e){}
                                setFormDisabled(true);
                            } else {
                                foundNotice.style.display = 'none';
                                setFormDisabled(false);
                                if(foundNotice.querySelector('.small-actions')) foundNotice.removeChild(actionsWrap);
                            }
                        }).catch(function(){ foundNotice.style.display='none'; setFormDisabled(false); });
                }
                ced.addEventListener('input', function(){ clearTimeout(timeout); timeout = setTimeout(runCheck, 500); });
                ced.addEventListener('blur', runCheck);
            }
        })();
    </script>
</div>
