{% extends 'base.html' %}
{% block content %}
<div class="registro-wizard">
    <div class="wizard-progress">
        <ul>
            <li class="completed">Tipo de persona</li>
            <li class="completed">Datos personales</li>
            <li class="active">Cédula y familia</li>
        </ul>
    </div>
    <form method="post">
        <h2>Cédula y familia</h2>
        <div class="form-group">
            <label for="cedula">Cédula:</label>
            <input type="text" name="cedula" id="cedula" required>
            <div class="error-text" id="error-cedula"></div>
        </div>
        <div class="form-group">
            <label for="num_hijos">Número de hijos a inscribir:</label>
            <input type="number" name="num_hijos" id="num_hijos" min="1" required>
        </div>
        <div class="form-group">
            <label for="relacion_familiar">Relación representante-hijos:</label>
            {% if error_msg %}
                <div class="alert alert-danger">{{ error_msg }}</div>
            {% endif %}
            <select name="relacion" id="relacion_familiar" required>
                <option value="" disabled selected>Seleccione...</option>
                {% for r in relaciones %}
                    <option value="{{ r['id_parentesco'] }}">{{ r['nombre_parentesco'] }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" id="btn_siguiente" class="btn btn-success" disabled>Siguiente</button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const cedula = document.getElementById('cedula');
    const numHijos = document.getElementById('num_hijos');
    const relacion = document.getElementById('relacion_familiar');
    const btn = document.getElementById('btn_siguiente');
    const errorCedula = document.getElementById('error-cedula');

    let cedulaDuplicada = false;

    function validarCedula(valor) {
        // Ejemplo: cédula venezolana (7-8 dígitos)
        return /^\d{7,8}$/.test(valor);
    }

    function setCedulaError(message) {
        cedula.classList.add('error-border');
        if (errorCedula) errorCedula.textContent = message;
        cedulaDuplicada = true;
        actualizarBoton();
    }

    function clearCedulaError() {
        cedula.classList.remove('error-border');
        if (errorCedula) errorCedula.textContent = '';
        cedulaDuplicada = false;
        actualizarBoton();
    }

    function actualizarBoton() {
        const cedulaValida = validarCedula(cedula.value);
        const hijosValidos = parseInt(numHijos.value, 10) >= 1;
        const relacionValida = relacion.value !== "";
        const habilitado = cedulaValida && hijosValidos && relacionValida && !cedulaDuplicada;
        btn.disabled = !habilitado;
        if (habilitado) {
            btn.classList.add('btn-activo');
        } else {
            btn.classList.remove('btn-activo');
        }
    }

    function validarCedulaEnServidor() {
        const val = cedula.value.trim();
        if (!val || !validarCedula(val)) {
            clearCedulaError();
            return;
        }
        fetch('/api/persona/lookup?numero=' + encodeURIComponent(val))
            .then(function(resp) { return resp.json ? resp.json() : resp.text().then(JSON.parse); })
            .then(function(data) {
                if (data && data.found) {
                    setCedulaError('Error: Se a detectado que esta cedula ya la posee otra persona');
                } else {
                    clearCedulaError();
                }
            })
            .catch(function() {
                // En caso de error de red, no bloquear el avance.
                clearCedulaError();
            });
    }

    cedula.addEventListener('blur', validarCedulaEnServidor);
    cedula.addEventListener('input', function() {
        clearCedulaError();
        actualizarBoton();
    });
    numHijos.addEventListener('input', actualizarBoton);
    relacion.addEventListener('change', actualizarBoton);

    // Si server devolvió error, mostrarlo
    {% if error_msg %}
        setCedulaError('{{ error_msg }}');
    {% endif %}

    actualizarBoton();
});
</script>
<style>
.btn-activo {
    background-color: #28a745 !important;
    border-color: #28a745 !important;
    color: #fff;
    cursor: pointer;
    opacity: 1;
    transition: background 0.2s;
}
#btn_siguiente:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
</style>
{% endblock %}
