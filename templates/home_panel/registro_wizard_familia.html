{% extends 'base.html' %}
{% block content %}
<div class="registro-wizard">
    <div class="wizard-progress">
        <ul>
            <li class="completed">Tipo de persona</li>
            <li class="completed">Datos personales</li>
            <li class="active">Cédula y familia</li>
        </ul>
    </div>
    <form method="post">
        <h2>Cédula y familia</h2>
        <div class="form-group">
            <label for="cedula">Cédula:</label>
            <input type="text" name="cedula" id="cedula" required>
        </div>
        <div class="form-group">
            <label for="num_hijos">Número de hijos a inscribir:</label>
            <input type="number" name="num_hijos" id="num_hijos" min="0" required>
        </div>
        <div class="form-group">
            <label for="relacion">Relación representante-hijos:</label>
            <input type="text" name="relacion" id="relacion" required>
        </div>
        <button type="submit" class="btn btn-success">Finalizar registro</button>
    </form>
</div>
{% endblock %}
