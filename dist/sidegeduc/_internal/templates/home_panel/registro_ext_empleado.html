<div>
    <h3>Completar datos: Empleado</h3>
    {% if message %}<p style="color:green">{{ message }}</p>{% endif %}
    <p class="muted">Persona: {{ persona[1] }} {{ persona[2] }}</p>
    <form method="post">
        <label>Cargo:<br>
            <select name="id_cargo">
                <option value="">-- ninguno --</option>
                {% for c in cargos %}
                    <option value="{{ c.id_cargo }}">{{ c.nombre_cargo }}</option>
                {% endfor %}
            </select>
        </label><br>
        <label>Fecha contratación:<br><input type="date" name="fecha_contratacion"></label><br>
        <label>Salario:<br><input type="number" step="0.01" name="salario"></label><br>
        <div style="margin-top:8px">
            <button class="panel-btn" type="submit">Guardar Empleado</button>
        </div>
    </form>
</div>
