<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Importar/Exportar Base de Datos</h3>
                </div>
                <div class="card-body">
                    {% if message %}
                        <div class="alert alert-info">{{ message }}</div>
                    {% endif %}
                    <form method="post" enctype="multipart/form-data" class="mb-3">
                        <input type="hidden" name="action" value="export">
                        <button type="submit" class="btn btn-success">Exportar BD a SQL</button>
                    </form>
                    <form method="post" enctype="multipart/form-data" class="mb-3">
                        <input type="hidden" name="action" value="upload_github">
                        <div class="mb-3">
                            <label for="github_token" class="form-label">GitHub Token:</label>
                            <input type="password" id="github_token" name="github_token" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="repo" class="form-label">Repositorio (owner/repo):</label>
                            <input type="text" id="repo" name="repo" class="form-control" placeholder="usuario/repo" required>
                        </div>
                        <button type="submit" class="btn btn-warning">Subir Backup a GitHub</button>
                    </form>
                    <form method="post" enctype="multipart/form-data">
                        <input type="hidden" name="action" value="import">
                        <div class="mb-3">
                            <label for="sql_file" class="form-label">Seleccionar archivo SQL:</label>
                            <input type="file" id="sql_file" name="sql_file" class="form-control" accept=".sql">
                        </div>
                        <button type="submit" class="btn btn-primary">Importar BD desde SQL</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
