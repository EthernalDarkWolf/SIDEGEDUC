<div class="container-fluid" style="margin-top:90px;">
  <div class="row align-items-center mb-3">
    <div class="col-auto">
      <a href="{{ url_for('consultas') }}" class="btn btn-outline-secondary" style="font-weight:bold;">
        &larr; Volver
      </a>
    </div>
    <div class="col-auto">
      <h2 class="mb-0" style="font-weight:600; font-size:2rem;">Listado de Secciones</h2>
    </div>
    <div class="col text-end">
      <div class="input-group" style="max-width:260px; float:right;">
        <input id="filtro-listado" type="text" class="form-control" placeholder="Filtrar resultados..." autocomplete="off">
        <span class="input-group-text"><i class="fas fa-filter"></i></span>
      </div>
    </div>
  </div>
  <link rel="stylesheet" href="/static/home_panel/filtro-dinamico.css">
  <script src="/static/home_panel/filtro-dinamico.js"></script>
  {% if rows and rows|length > 0 %}
  <table class="table table-striped">
    <thead>
      <tr>
        <th style="width:5%;">#</th>
        <th style="width:75%;">Nombre</th>
        <th style="width:10%;text-align:center;">Acciones</th>
      </tr>
    </thead>
    <tbody>
      {% for r in rows %}
      <tr>
        <td>{{ loop.index }}</td>
        <td>{{ r[1] }}</td>
        <td style="text-align:center;">
          <a class="btn btn-sm btn-outline-primary" href="/consultas/secciones/editar?id={{ r[0] }}" title="Editar"><i class="fas fa-pencil-alt"></i></a>
          <form method="post" action="/consultas/secciones/borrar" style="display:inline-block;margin:0;">
            <input type="hidden" name="id" value="{{ r[0] }}">
            <button class="btn btn-sm btn-outline-danger" title="Borrar" onclick="return confirm('¿Eliminar esta sección?')"><i class="fas fa-trash"></i></button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <div class="alert alert-info text-center" style="margin-top:48px;font-size:1.2em;">
    <i class="fas fa-info-circle me-2"></i>
    No Hay registros para mostrar.
  </div>
  {% endif %}
</div>
