<div class="container-fluid py-3">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Configuración de Usuario</h5>
                    <small>Cambia tus credenciales y gestiona tu cuenta</small>
                </div>
                <div class="card-body">
                    {% if message %}
                        <div class="alert alert-{{ message_type or 'info' }}" role="alert">{{ message }}</div>
                    {% endif %}

                    <form method="post" enctype="multipart/form-data" class="mb-4">
                        <input type="hidden" name="action" value="change_name">
                        <div class="mb-3">
                            <label class="form-label">Nombre de usuario</label>
                            <div class="input-group">
                                <input type="text" name="new_name" class="form-control" placeholder="Nuevo nombre" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+" title="Solo letras y espacios">
                                <button class="btn btn-success" type="submit">Actualizar nombre</button>
                            </div>
                        </div>
                    </form>
                    <form method="post" class="mb-4">
                        <input type="hidden" name="action" value="change_password">
                        <h6>Cambiar contraseña</h6>
                        <div class="mb-3">
                            <label class="form-label">Contraseña actual</label>
                            <input type="password" name="current_password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nueva contraseña</label>
                            <input type="password" name="new_password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirmar nueva contraseña</label>
                            <input type="password" name="confirm_password" class="form-control" required>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-primary" type="submit">Cambiar contraseña</button>
                            <small class="text-muted align-self-center">La contraseña actual es requerida para seguridad</small>
                        </div>
                    </form>

                    <hr>
                    <div>
                        <h6 class="text-danger">Eliminar cuenta</h6>
                        <p class="text-muted">Al eliminar tu cuenta se borrarán tus datos. Esta acción es irreversible.</p>
                        <form method="post" onsubmit="return confirm('¿Confirmas eliminar tu cuenta? Esta acción no se puede deshacer.')">
                            <input type="hidden" name="action" value="delete_account">
                            <div class="mb-3">
                                <label class="form-label">Ingresa tu contraseña para confirmar</label>
                                <input type="password" name="confirm_password_delete" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-outline-danger">Eliminar mi cuenta</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Pequeñas mejoras visuales adaptadas al diseño del panel */
    .card-header.small { font-size: 0.9rem }
    .card { border-radius: 10px }
</style>
