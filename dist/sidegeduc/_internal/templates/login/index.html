<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIDEGEDUC - Iniciar sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login/style.css') }}" />
    <style>
        /* Fallback and page-specific styles (kept small) */
        :root{--bg:#071023;--card:#0f1724cc;--accent:#2bd6b6;--muted:#9aa4ad}
        html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;color:#e6eef6;background:linear-gradient(90deg,#071023 0%, #0b1220 60%)}
        .container{min-height:100vh;display:grid;grid-template-columns:1fr 420px;gap:2rem;align-items:center;padding:3rem}
        .hero{background-image: url('{{ url_for('static', filename='login/bg-image.jpg') }}');background-size:cover;background-position:center;border-radius:12px;box-shadow:0 6px 30px rgba(2,6,23,.6);min-height:70vh}
        .overlay{background:linear-gradient(180deg, rgba(2,6,23,0.35), rgba(5,10,18,0.55));height:100%;border-radius:12px;display:flex;align-items:center;justify-content:center}
        .card{background:rgba(10,16,24,0.7);backdrop-filter:blur(6px);padding:2.2rem;border-radius:12px;color:#fff;box-shadow:0 10px 30px rgba(2,6,23,.6)}
        .logo{font-weight:800;color:var(--accent);letter-spacing:1px;margin-bottom:0.5rem}
        h1{margin:0 0 0.4rem 0;font-size:1.6rem}
        p.lead{margin:0 0 1.2rem 0;color:var(--muted);font-size:0.95rem}
        .form-group{display:flex;flex-direction:column;margin-bottom:0.9rem}
        label{font-size:0.85rem;color:var(--muted);margin-bottom:0.35rem}
        input[type="text"],input[type="password"]{padding:0.9rem 1rem;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);color:#eaf6f1;outline:none}
        input::placeholder{color:rgba(234,246,241,0.25)}
        .btn{display:inline-block;margin-top:0.6rem;padding:0.9rem 1.2rem;border-radius:999px;background:linear-gradient(90deg,var(--accent),#00bfa5);border:none;color:#042018;cursor:pointer;font-weight:700}
        .alt-link{margin-top:0.9rem;color:var(--muted);font-size:0.9rem}
        .alt-link a{color:#bfeee3;text-decoration:none}
        /* Modal */
        .modal-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,0.55);visibility:hidden;opacity:0;transition:all .18s}
        .modal-overlay.visible{visibility:visible;opacity:1}
        .modal{background:#fff;color:#0b1220;padding:1.6rem;border-radius:10px;min-width:320px;max-width:520px;text-align:center}
        .modal h2{margin:0 0 0.6rem;font-size:1.1rem}
        .modal p{color:#334155}
        .modal button{margin-top:1rem;padding:0.5rem 0.9rem;border-radius:8px;border:none;background:#111827;color:#fff}
        /* Password toggle */
        .password-field{position:relative;display:flex;align-items:center}
        .password-field .pw-toggle{position:absolute;right:8px;background:transparent;border:0;color:rgba(234,246,241,0.55);font-size:1rem;padding:6px 8px;border-radius:8px;cursor:pointer}
        .password-field .pw-toggle:focus{outline:2px solid rgba(43,214,182,0.14)}
        .password-strength{margin-top:0.5rem;font-size:0.8rem;height:1rem}
        .password-strength.weak{color:red}
        .password-strength.medium{color:orange}
        .password-strength.strong{color:green}
        /* simple panel transition */
        .panel{transition:opacity .22s ease,transform .22s cubic-bezier(.2,.9,.2,1)}
        .panel.hidden{opacity:0;transform:translateY(6px);pointer-events:none;height:0;overflow:hidden}
        @media(max-width:900px){.container{grid-template-columns:1fr;padding:1.2rem}.hero{display:none}.card{margin:0 auto;width:100%}}
    </style>
</head>
<body>
    <main class="container">
        <section class="hero">
            <div class="overlay">
                <!-- decorative left area, keep branding visible -->
            </div>
        </section>

        <aside>
            <div class="card">
                <div class="logo">SIDEGEDUC</div>
                <div class="tabs">
                    <button id="tab-login" class="tab active">Iniciar sesión</button>
                    <button id="tab-register" class="tab">Registrarse</button>
                </div>
                <div class="tab-content">
                    <div id="panel-login" class="panel">
                        <h1>Bienvenido</h1>
                        <p class="lead">Accede a tu cuenta para administrar y consultar información del sistema.</p>
                        <form action="{{ url_for('login.login_handler') }}" method="POST" novalidate>
                            <div class="form-group">
                                <label for="usuario">Nombre de usuario</label>
                                <input type="text" name="usuario" id="usuario" required placeholder="tu.usuario">
                            </div>

                            <div class="form-group">
                                <label for="clave">Contraseña</label>
                                <div class="password-field">
                                    <input type="password" name="clave" id="clave" required placeholder="Contraseña">
                                    <button type="button" class="pw-toggle" aria-label="Mostrar contraseña">👁</button>
                                </div>
                            </div>

                            <button type="submit" class="btn">Iniciar sesión</button>
                        </form>
                        <p class="alt-link">¿No tienes cuenta? <a href="{{ url_for('login.register_handler') }}" id="link-show-register">Regístrate</a></p>
                    </div>

                    <div id="panel-register" class="panel" style="display:none">
                        <h1>Crea tu cuenta</h1>
                        <p class="lead">Regístrate para acceder a las funcionalidades del sistema.</p>
                        <form action="{{ url_for('login.register_handler') }}" method="POST" novalidate>
                            <div class="form-group">
                                <label for="reg-usuario">Nombre de usuario</label>
                                <input type="text" name="usuario" id="reg-usuario" required placeholder="tu.usuario">
                            </div>

                            <div class="form-group">
                                <label for="reg-clave">Contraseña</label>
                                <div class="password-field">
                                    <input type="password" name="clave" id="reg-clave" required placeholder="Contraseña">
                                    <button type="button" class="pw-toggle" aria-label="Mostrar contraseña">👁</button>
                                </div>
                                <div id="password-strength" class="password-strength"></div>
                            </div>

                            <div class="form-group">
                                <label class="checkbox-row"><input type="checkbox" id="terms" name="terms" required> Acepto los términos de servicio</label>
                            </div>

                            <button type="submit" class="btn">Crear cuenta</button>
                        </form>
                        <p class="alt-link">¿Ya tienes cuenta? <a href="{{ url_for('login.login_handler') }}" id="link-show-login">Inicia sesión</a></p>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <!-- Modal overlay -->
    <div id="status-modal" class="modal-overlay" aria-hidden="true">
        <div class="modal">
            <h2 id="modal-title">Mensaje</h2>
            <p id="modal-message"></p>
            <button id="modal-close">Cerrar</button>
        </div>
    </div>

    <script>
        function showModal(title, message) {
            const overlay = document.getElementById('status-modal');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            overlay.setAttribute('aria-hidden', 'false');
            overlay.classList.add('visible');
        }

        // Declaración de la función setActiveTab (necesaria para los botones de pestañas)
        function setActiveTab(tab){
            const loginTab = document.getElementById('tab-login');
            const regTab = document.getElementById('tab-register');
            const panelLogin = document.getElementById('panel-login');
            const panelReg = document.getElementById('panel-register');
            if(!panelLogin || !panelReg) return;
            if(tab === 'register'){
                if(loginTab) loginTab.classList.remove('active');
                if(regTab) regTab.classList.add('active');
                panelLogin.style.display = 'none';
                panelReg.style.display = 'block';
            } else {
                if(regTab) regTab.classList.remove('active');
                if(loginTab) loginTab.classList.add('active');
                panelLogin.style.display = 'block';
                panelReg.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('modal-close');
            if (btn) {
                const redirectAfterModal = {{ redirect_after_modal|default(False)|tojson }};
                if (redirectAfterModal) {
                    btn.addEventListener('click', function() {
                        // si se indica redirigir, vamos al login (o página inicial de login)
                        window.location.href = "{{ url_for('login.login_handler') }}";
                    });
                } else {
                    btn.addEventListener('click', function() {
                        const overlay = document.getElementById('status-modal');
                        overlay.setAttribute('aria-hidden', 'true');
                        overlay.classList.remove('visible');
                    });
                }
            }

            // wire tab buttons
            const tLogin = document.getElementById('tab-login');
            const tReg = document.getElementById('tab-register');
            if(tLogin) tLogin.addEventListener('click', ()=>setActiveTab('login'));
            if(tReg) tReg.addEventListener('click', ()=>setActiveTab('register'));
            const lShowReg = document.getElementById('link-show-register');
            const lShowLogin = document.getElementById('link-show-login');
            if(lShowReg) lShowReg.addEventListener('click', (e)=>{e.preventDefault(); setActiveTab('register'); document.getElementById('reg-usuario').focus();});
            if(lShowLogin) lShowLogin.addEventListener('click', (e)=>{e.preventDefault(); setActiveTab('login'); document.getElementById('usuario').focus();});

            // Set initial active tab from server variable
            {% if active is defined %}
                setActiveTab({{ active|tojson }});
            {% else %}
                setActiveTab('login');
            {% endif %}

            {% if modal_show %}
                showModal({{ modal_title | tojson }}, {{ modal_message | tojson }});
            {% endif %}

            // Password strength validation
            const passwordInput = document.getElementById('reg-clave');
            const strengthIndicator = document.getElementById('password-strength');

            function checkPasswordStrength(password) {
                let strength = 0;
                if (password.length > 6) strength++;
                if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength++;
                return strength;
            }

            function updateStrengthIndicator() {
                const password = passwordInput.value;
                const strength = checkPasswordStrength(password);
                strengthIndicator.className = 'password-strength';
                if (password.length === 0) {
                    strengthIndicator.textContent = '';
                } else if (strength === 0) {
                    strengthIndicator.textContent = 'Débil';
                    strengthIndicator.classList.add('weak');
                } else if (strength === 1) {
                    strengthIndicator.textContent = 'Medio';
                    strengthIndicator.classList.add('medium');
                } else {
                    strengthIndicator.textContent = 'Fuerte';
                    strengthIndicator.classList.add('strong');
                }
            }

            if (passwordInput) {
                passwordInput.addEventListener('input', updateStrengthIndicator);
            }
        });
    </script>
    <script src="{{ url_for('static', filename='login/main.js') }}"></script>
</body>
</html>
